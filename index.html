<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        try {
          let saved;
          try { saved = localStorage.getItem('irala-theme'); } catch {}
          const theme = saved === 'dark' || saved === 'light' ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.backgroundColor = theme === 'dark' ? '#292d33' : '#f7f8fa';
          document.documentElement.style.colorScheme = theme;
        } catch {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Felipe Irala — Designer Gráfico & Direção Visual</title>
    <meta name="description" content="Um olhar, muitas formas. Conheça os projetos de identidade visual, direção de arte e fotografia de Felipe Irala, designer gráfico em Curitiba." />
    <meta name="theme-color" content="#292d33" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
