    <meta name="theme-color" content="#f7f8fa" />
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem('irala-theme'); } catch {}
        const theme = saved === 'dark' || saved === 'light' ? saved : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#292d33' : '#f7f8fa';
      })();
    </script>
